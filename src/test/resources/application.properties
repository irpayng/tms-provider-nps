# Test configuration
quarkus.application.name=provider-nps-test

# NPS Configuration (mock/test values - will be overridden by NpsMockServer)
nps.base-url=http://localhost:8888
nps.token-url=http://localhost:8888/token
nps.client-id=test-client
nps.client-secret=test-secret
nps.source-id=000000000000
nps.source-bic=TESTNGLA
nps.source-name=TEST BANK LIMITED
nps.timeout-ms=5000

# Skip crypto for testing (WireMock returns plain XML)
nps.skip-crypto=true

# Use test key paths
nps.private-key-path=src/test/resources/test-private.pem
nps.public-key-path=src/test/resources/test-public.pem
nps.nibss-public-key-path=src/test/resources/test-nibss-public.pem
nps.certificate-path=src/test/resources/test-cert.pem

# API tests use an acknowledgement sink rather than a live Kafka broker.
# Broker nack/timeout behavior is verified by NpsCallbackHandlerTest.
quarkus.redis.devservices.enabled=false
quarkus.kafka.devservices.enabled=false
mp.messaging.outgoing.client-logs.connector=test-acknowledging
mp.messaging.outgoing.nps-logs.connector=test-acknowledging
mp.messaging.outgoing.nps-inbound-transfers.connector=test-acknowledging
mp.messaging.outgoing.nps-status-updates.connector=test-acknowledging

# gRPC
quarkus.grpc.server.use-separate-server=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.provider.nps".level=DEBUG
