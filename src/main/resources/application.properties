quarkus.application.name=provider-nps-microservice

# HTTP Configuration
quarkus.http.port=${APP_PORT:8098}

# NPS Configuration (NIBSS National Payment Stack - ISO 20022)
nps.base-url=${NPS_BASE_URL:https://apitest.nibss-plc.com.ng:8022}
nps.token-url=${NPS_TOKEN_URL:https://apitest.nibss-plc.com.ng:1443/reset}
nps.client-id=${NPS_CLIENT_ID:test-client-id}
nps.client-secret=${NPS_CLIENT_SECRET:test-client-secret}
nps.source-id=${NPS_SOURCE_ID:000000}
nps.source-bic=${NPS_SOURCE_BIC:IRPYNGLA}
nps.source-name=${NPS_SOURCE_NAME:IRPAY FINTECH LIMITED}
nps.source-account=${NPS_SOURCE_ACCOUNT:0000000000}

# RSA key paths for XML signing/encryption
nps.private-key-path=${NPS_PRIVATE_KEY_PATH:/etc/nps/keys/private.pem}
nps.public-key-path=${NPS_PUBLIC_KEY_PATH:/etc/nps/keys/public.pem}
nps.nibss-public-key-path=${NPS_NIBSS_PUBLIC_KEY_PATH:/etc/nps/keys/nibss-public.pem}
nps.certificate-path=${NPS_CERTIFICATE_PATH:/etc/nps/keys/certificate.pem}

# Token refresh interval (seconds before expiry to refresh)
nps.token-refresh-margin-seconds=${NPS_TOKEN_REFRESH_MARGIN_SECONDS:300}

# Shared outbound request deadline, including token acquisition and retries (ms)
nps.timeout-ms=${NPS_TIMEOUT_MS:20000}

# Leave time for callback parsing and crypto within NPS's 10-second payment window.
nps.callback.publish-timeout-ms=${NPS_CALLBACK_PUBLISH_TIMEOUT_MS:5000}

# Internal API key for service-to-service auth
grpc.api.key=${GRPC_API_KEY:secret}

# Logging
quarkus.log.file.enable=true
quarkus.log.file.path=logs/application.log
quarkus.log.file.level=INFO
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] %s%e%n

# gRPC server (shared with HTTP on same port)
quarkus.grpc.server.use-separate-server=false

# Redis (for token caching and session state)
quarkus.redis.hosts=${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:26379}}
quarkus.redis.client-type=sentinel
quarkus.redis.master-name=${REDIS_MASTER_NAME:mymaster}
quarkus.redis.password=${REDIS_PASSWORD:}
quarkus.redis.devservices.enabled=false

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# SASL/SCRAM authentication (active in prod/staging, ignored locally)
%prod.kafka.security.protocol=SASL_PLAINTEXT
%prod.kafka.sasl.mechanism=SCRAM-SHA-512
%prod.kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";

# Outgoing Kafka channels
mp.messaging.outgoing.client-logs.connector=smallrye-kafka
mp.messaging.outgoing.client-logs.topic=client-logs
mp.messaging.outgoing.client-logs.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.nps-logs.connector=smallrye-kafka
mp.messaging.outgoing.nps-logs.topic=nps-logs
mp.messaging.outgoing.nps-logs.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka channels for NPS callbacks (inbound messages from NIBSS)
mp.messaging.outgoing.nps-inbound-transfers.connector=smallrye-kafka
mp.messaging.outgoing.nps-inbound-transfers.topic=nps-inbound-transfers
mp.messaging.outgoing.nps-inbound-transfers.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.nps-status-updates.connector=smallrye-kafka
mp.messaging.outgoing.nps-status-updates.topic=nps-status-updates
mp.messaging.outgoing.nps-status-updates.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Native image configuration
quarkus.native.additional-build-args=-H:IncludeResourceBundles=sun.security.util.resources.security,--initialize-at-run-time=org.apache.xml.security

# The endpoint pages show conflicting operation URLs and shared Endpoint URL text.
nps.name-enquiry-path=${NPS_NAME_ENQUIRY_PATH:/nps/acmt}
nps.credit-transfer-path=${NPS_CREDIT_TRANSFER_PATH:/nps/pacs}
nps.requery-path=${NPS_REQUERY_PATH:/nps/pacs}
nps.payment-initiation-path=${NPS_PAYMENT_INITIATION_PATH:/nps/pain}

# HTTP JSON facade is for explicit testing; internal production communication uses gRPC.
nps.http.enabled=${NPS_HTTP_ENABLED:false}
%dev.nps.http.enabled=${NPS_HTTP_ENABLED:true}

# NIBSS-initiated enquiries, credits and payment statuses are forwarded by gRPC.
nps.inbound.mode=grpc
nps.internal.enabled=${NPS_INTERNAL_ENABLED:false}
nps.internal.timeout-ms=${NPS_INTERNAL_TIMEOUT_MS:3000}
nps.internal.bearer-token=${NPS_INTERNAL_BEARER_TOKEN:}
quarkus.grpc.clients.institution.host=${NPS_INTERNAL_HOST:localhost}
quarkus.grpc.clients.institution.port=${NPS_INTERNAL_PORT:9001}
quarkus.grpc.clients.institution.plain-text=${NPS_INTERNAL_PLAINTEXT:false}

# Persistent storage for inbound replay and outbound submission protection.
# Independent replica disks do not coordinate; see README deployment limits.
nps.journal.directory=${NPS_JOURNAL_DIRECTORY:data/nps-journal}

# Interactive HTTP API documentation (Swagger UI is available in dev/test).
quarkus.smallrye-openapi.info-title=NIBSS NPS Adapter HTTP API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=JSON testing facade for NIBSS operations. Business outcomes are returned in the response status field. HTTP routes require NPS_HTTP_ENABLED=true outside dev/test.
quarkus.swagger-ui.path=swagger-ui
quarkus.swagger-ui.always-include=${SWAGGER_UI_ALWAYS_INCLUDE:false}
